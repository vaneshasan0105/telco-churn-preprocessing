# ============================================================
# .github/workflows/preprocessing.yml
#
# CI Workflow: Otomatisasi Preprocessing Telco Customer Churn
#
# Trigger  : Push ke branch 'main'
# Aksi     : Jalankan automate_vaneshasan.py lalu commit
#             hasilnya kembali ke repositori sebagai dataset
#             terbaru yang siap dilatih.
# ============================================================

name: "🔄 Preprocessing Pipeline - Telco Churn"

on:
  # ── Trigger utama: setiap push ke branch main ──
  push:
    branches:
      - main
    paths:
      # Hanya jalankan jika file-file ini berubah
      - 'SMSML_Vanes Hasan/WA_Fn-UseC_-Telco-Customer-Churn.csv'
      - 'SMSML_Vanes Hasan/automate_vaneshasan.py'
      - 'SMSML_Vanes Hasan/requirements.txt'
      - '.github/workflows/preprocessing.yml'

  # ── Trigger manual dari tab "Actions" di GitHub ──
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Path ke file CSV dataset'
        required: false
        default: 'WA_Fn-UseC_-Telco-Customer-Churn.csv'
      output_dir:
        description: 'Folder output hasil preprocessing'
        required: false
        default: 'telco_preprocessing'

# ──────────────────────────────────────────────
# Hak akses: baca repo + tulis konten (untuk commit balik)
# ──────────────────────────────────────────────
permissions:
  contents: write

jobs:
  preprocess:
    name: "Run Preprocessing Script"
    runs-on: ubuntu-latest  # Runner gratis GitHub

    steps:
      # ── Step 1: Checkout repositori ──
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Ambil seluruh history untuk git push

      # ── Step 2: Setup Python ──
      - name: "🐍 Setup Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'     # Cache dependencies agar build lebih cepat

      # ── Step 3: Install dependencies ──
      - name: "📦 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          # Gunakan requirements.txt jika ada, jika tidak install manual
          if [ -f "SMSML_Vanes Hasan/requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy scikit-learn
          fi

      # ── Step 4: Verifikasi keberadaan dataset ──
      - name: "🔍 Verifikasi Dataset"
        run: |
          INPUT_FILE="${{ github.event.inputs.input_file || 'SMSML_Vanes Hasan/WA_Fn-UseC_-Telco-Customer-Churn.csv' }}"
          if [ ! -f "$INPUT_FILE" ]; then
            echo "❌ ERROR: File dataset '$INPUT_FILE' tidak ditemukan di repositori."
            echo "   Pastikan file CSV telah di-commit ke branch main."
            exit 1
          fi
          echo "✅ Dataset ditemukan: $INPUT_FILE"
          echo "   Ukuran: $(du -sh "$INPUT_FILE" | cut -f1)"

      # ── Step 5: Jalankan skrip preprocessing ──
      - name: "⚙️ Jalankan Preprocessing Pipeline"
        run: |
          INPUT_FILE="${{ github.event.inputs.input_file || 'SMSML_Vanes Hasan/WA_Fn-UseC_-Telco-Customer-Churn.csv' }}"
          OUTPUT_DIR="${{ github.event.inputs.output_dir || 'telco_preprocessing' }}"
          echo "▶ Menjalankan: python 'SMSML_Vanes Hasan/automate_vaneshasan.py' --input '$INPUT_FILE' --output '$OUTPUT_DIR'"
          python 'SMSML_Vanes Hasan/automate_vaneshasan.py' --input "$INPUT_FILE" --output "$OUTPUT_DIR"

      # ── Step 6: Tampilkan log hasil ──
      - name: "📋 Tampilkan Log Preprocessing"
        if: always()
        run: |
          echo "=== ISI FOLDER OUTPUT ==="
          ls -lh telco_preprocessing/ || echo "(folder kosong atau tidak ditemukan)"
          echo ""
          echo "=== LOG PREPROCESSING ==="
          cat preprocessing.log || echo "(log tidak ditemukan)"

      # ── Step 7: Upload artifact untuk inspeksi ──
      - name: "💾 Upload Hasil sebagai GitHub Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: preprocessed-dataset-${{ github.run_number }}
          path: |
            telco_preprocessing/
            preprocessing.log
          retention-days: 30   # Simpan selama 30 hari

      # ── Step 8: Commit & push hasil preprocessing kembali ke repo ──
      - name: "🔁 Commit Hasil ke Repositori"
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"

          # Tambahkan folder output dan log ke staging
          git add telco_preprocessing/ preprocessing.log

          # Cek apakah ada perubahan sebelum commit
          if git diff --cached --quiet; then
            echo "✅ Tidak ada perubahan pada hasil preprocessing. Commit dilewati."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            git commit -m "🤖 [CI] Update preprocessed dataset — $TIMESTAMP

          Run    : #${{ github.run_number }}
          Trigger: ${{ github.event_name }}
          Branch : ${{ github.ref_name }}
          Commit : ${{ github.sha }}"

            git push
            echo "✅ Hasil preprocessing berhasil di-push ke repositori."
          fi

      # ── Step 9: Notifikasi ringkasan ke GitHub Summary ──
      - name: "📊 Ringkasan Pipeline"
        if: always()
        run: |
          echo "## 🔄 Preprocessing Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo ""                                      >> $GITHUB_STEP_SUMMARY
          echo "| Item         | Nilai                                      |" >> $GITHUB_STEP_SUMMARY
          echo "|:-------------|:-------------------------------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number   | #${{ github.run_number }}                  |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger      | ${{ github.event_name }}                   |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch       | ${{ github.ref_name }}                     |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp    | $(date -u '+%Y-%m-%d %H:%M:%S UTC')        |" >> $GITHUB_STEP_SUMMARY
          echo ""                                      >> $GITHUB_STEP_SUMMARY
          echo "### 📁 File Output"                   >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`"                               >> $GITHUB_STEP_SUMMARY
          ls -lh telco_preprocessing/ 2>/dev/null || echo "(tidak ada file)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`"                               >> $GITHUB_STEP_SUMMARY
