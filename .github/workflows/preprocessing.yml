name: Preprocessing Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Eksperimen_SML_Vanes Hasan/WA_Fn-UseC_-Telco-Customer-Churn.csv'
      - 'Eksperimen_SML_Vanes Hasan/preprocessing/automate_Vanes Hasan.py'
      - 'Eksperimen_SML_Vanes Hasan/requirements.txt'
      - '.github/workflows/preprocessing.yml'
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: "🔍 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "📦 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          if [ -f "Eksperimen_SML_Vanes Hasan/requirements.txt" ]; then
            pip install -r "Eksperimen_SML_Vanes Hasan/requirements.txt"
          else
            pip install pandas numpy scikit-learn
          fi

      - name: "⚙️ Jalankan Preprocessing Pipeline"
        run: |
          INPUT_FILE="Eksperimen_SML_Vanes Hasan/WA_Fn-UseC_-Telco-Customer-Churn.csv"
          OUTPUT_DIR="Eksperimen_SML_Vanes Hasan/preprocessing"
          
          echo "▶ Menjalankan skrip otomasi dari bos..."
          python "Eksperimen_SML_Vanes Hasan/preprocessing/automate_Vanes Hasan.py" --input "$INPUT_FILE" --output "$OUTPUT_DIR"

      - name: "🗄️ Upload Preprocessing Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: telco-churn-processed-data
          path: |
            Eksperimen_SML_Vanes Hasan/preprocessing/X_processed.csv
            Eksperimen_SML_Vanes Hasan/preprocessing/y_processed.csv
