name: "🔁 Retrain & Deploy — Telco Churn MLProject"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION   : "3.12.7"
  MLFLOW_VERSION   : "2.19.0"
  MODEL_LOCAL_DIR  : "saved_model"
  ARTIFACT_DIR     : "artifacts"
  DOCKER_IMAGE_NAME: "${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-rf"
  DOCKER_TAG       : "latest"

jobs:
  retrain:
    name: "⚙️ MLflow Project Retraining"
    runs-on: ubuntu-latest
    outputs:
      docker_image: ${{ steps.set-outputs.outputs.docker_image }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: "📦 Install Dependencies"
        run: |
          pip install --upgrade pip
          pip install mlflow==${{ env.MLFLOW_VERSION }} dagshub pandas numpy scikit-learn matplotlib seaborn

      - name: "🔍 Deteksi & Normalisasi Folder Proyek"
        id: find-dir
        run: |
          TARGET_DIR=$(find . -type d -path "./Workflow-CI*MLProject" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ Folder Workflow-CI/MLProject tidak ditemukan!"
            exit 1
          fi
          echo "PROJECT_PATH=$TARGET_DIR" >> $GITHUB_ENV

      - name: "🚀 Jalankan MLflow Retraining (Direct Python)"
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_OWNER: ${{ vars.DAGSHUB_OWNER }}
          DAGSHUB_REPO:  ${{ vars.DAGSHUB_REPO }}
        run: |
          cd "$PROJECT_PATH"
          python train.py

      - name: "🔎 Ambil Output Model"
        run: |
          if [ -d "$PROJECT_PATH/${{ env.MODEL_LOCAL_DIR }}" ]; then
            cp -r "$PROJECT_PATH/${{ env.MODEL_LOCAL_DIR }}" .
          fi

      - name: "📤 Set Job Outputs"
        id: set-outputs
        run: |
          echo "docker_image=${{ env.DOCKER_IMAGE_NAME }}" >> $GITHUB_OUTPUT

  build-and-push-docker:
    name: "🐳 Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: retrain

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔐 Login ke Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "📦 Buat Dockerfile Manual (Bypass MLflow Lock)"
        run: |
          # Membuat Dockerfile standar industri secara instan di dalam runner
          cat << 'EOF' > Dockerfile
          FROM python:3.12.7-slim
          WORKDIR /app
          RUN apt-get update && apt-get install -y libgomp1 && rm -rf /var/lib/apt/lists/*
          COPY . /app
          RUN pip install --no-cache-dir mlflow==2.19.0 scikit-learn pandas numpy
          EXPOSE 5001
          CMD ["mlflow", "models", "serve", "-m", "saved_model", "--host", "0.0.0.0", "--port", "5001", "--no-conda"]
          EOF

      - name: "🏗️ Build dan Push ke Docker Hub"
        run: |
          FULL_IMAGE="${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}"
          docker build -t "$FULL_IMAGE" .
          docker push "$FULL_IMAGE"
