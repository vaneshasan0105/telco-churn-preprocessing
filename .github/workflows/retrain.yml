name: "🔁 Retrain & Deploy — Telco Churn MLProject"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION   : "3.12.7"
  MLFLOW_VERSION   : "2.19.0"
  MODEL_LOCAL_DIR  : "saved_model"
  ARTIFACT_DIR     : "artifacts"
  DOCKER_IMAGE_NAME: "${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-rf"
  DOCKER_TAG       : "latest"

jobs:
  retrain:
    name: "⚙️ MLflow Project Retraining"
    runs-on: ubuntu-latest
    outputs:
      docker_image: ${{ steps.set-outputs.outputs.docker_image }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: "📦 Install Dependencies"
        run: |
          pip install --upgrade pip
          pip install mlflow==${{ env.MLFLOW_VERSION }} dagshub pandas numpy scikit-learn matplotlib seaborn

      - name: "🔍 Deteksi & Normalisasi Folder Proyek"
        id: find-dir
        run: |
          TARGET_DIR=$(find . -type d -path "./Workflow-CI*MLProject" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ Folder Workflow-CI/MLProject tidak ditemukan!"
            exit 1
          fi
          echo "PROJECT_PATH=$TARGET_DIR" >> $GITHUB_ENV

      - name: "🚀 Jalankan MLflow Retraining (Direct Python)"
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_OWNER: ${{ vars.DAGSHUB_OWNER }}
          DAGSHUB_REPO:  ${{ vars.DAGSHUB_REPO }}
        run: |
          cd "$PROJECT_PATH"
          python train.py

      - name: "🔎 Ambil Output Model"
        run: |
          if [ -d "$PROJECT_PATH/${{ env.MODEL_LOCAL_DIR }}" ]; then
            cp -r "$PROJECT_PATH/${{ env.MODEL_LOCAL_DIR }}" .
          fi

      - name: "📤 Set Job Outputs"
        id: set-outputs
        run: |
          echo "docker_image=${{ env.DOCKER_IMAGE_NAME }}" >> $GITHUB_OUTPUT

  build-and-push-docker:
    name: "🐳 Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: retrain

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔐 Login ke Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: "🏗️ Build & Push via MLflow"
        run: |
          mkdir -p ${{ env.MODEL_LOCAL_DIR }}
          
          cat << 'EOF' > ${{ env.MODEL_LOCAL_DIR }}/MLmodel
          artifact_path: model
          flavors:
            python_function:
              env: {conda: conda.yaml, virtualenv: python_env.yaml}
              loader_module: mlflow.sklearn
              python_version: 3.12.7
            sklearn:
              pickled_model: model.pkl
              serialization_format: cloudpickle
              sklearn_version: 1.5.2
          run_id: dummy_run_id
          utc_time_created: '2026-06-08 11:00:00.000000'
          EOF
          
          pip install mlflow==${{ env.MLFLOW_VERSION }} scikit-learn
          
          FULL_IMAGE="${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}"
          mlflow models build-docker --model-uri "${{ env.MODEL_LOCAL_DIR }}" --name "$FULL_IMAGE" --enable-mlserver
          docker push "$FULL_IMAGE"
      
