# ============================================================
# .github/workflows/retrain.yml
#
# CI Workflow: Automated Retraining Pipeline (Disesuaikan dengan struktur folder lokal)
# Kriteria 3 — Advance: Membangun Sistem Machine Learning (Dicoding)
# ============================================================

name: "🔁 Retrain & Deploy — Telco Churn MLProject"

on:
  # ── Trigger utama: setiap push ke main ──
  push:
    branches:
      - main
    paths:
      # Pipeline berjalan jika ada perubahan di dalam folder-folder ini
      - 'Membangun_model/telco_preprocessing/**'
      - 'Workflow-CI/MLProject/**'
      - '.github/workflows/retrain.yml'

  # ── Trigger manual dari tab Actions ──
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Jumlah pohon (n_estimators)'
        required: false
        default: '300'
      max_depth:
        description: 'Kedalaman maksimum pohon (None = unlimited)'
        required: false
        default: 'None'
      min_samples_split:
        description: 'min_samples_split'
        required: false
        default: '5'
      min_samples_leaf:
        description: 'min_samples_leaf'
        required: false
        default: '2'
      max_features:
        description: 'max_features (sqrt / log2)'
        required: false
        default: 'sqrt'
      class_weight:
        description: 'class_weight (balanced / None)'
        required: false
        default: 'balanced'
      docker_tag:
        description: 'Tag Docker image (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

env:
  PYTHON_VERSION   : "3.12.7"
  MLFLOW_VERSION   : "2.19.0"
  MODEL_LOCAL_DIR  : "saved_model"
  ARTIFACT_DIR     : "artifacts"
  DOCKER_IMAGE_NAME: "${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-rf"
  DOCKER_TAG       : "${{ github.event.inputs.docker_tag || 'latest' }}"
  # Definisi lokasi folder utama proyek ML Anda
  PROJECT_DIR      : "Workflow-CI/MLProject"

jobs:
  # ════════════════════════════════════════════════════════════
  # JOB 1: RETRAINING via MLflow Project
  # ════════════════════════════════════════════════════════════
  retrain:
    name: "⚙️ MLflow Project Retraining"
    runs-on: ubuntu-latest

    outputs:
      docker_image: ${{ steps.set-outputs.outputs.docker_image }}
      run_id:       ${{ steps.set-outputs.outputs.run_id }}

    steps:
      # ── Step 1: Checkout ──
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Step 2: Setup Python ──
      - name: "🐍 Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # ── Step 3: Install MLflow & Dependencies Minimal ──
      - name: "📦 Install MLflow CLI & DagsHub"
        run: |
          python -m pip install --upgrade pip
          pip install \
            mlflow==${{ env.MLFLOW_VERSION }} \
            dagshub>=0.3.25 \
            pandas>=2.2.0 \
            numpy>=1.26.0 \
            scikit-learn>=1.4.0 \
            matplotlib>=3.8.0 \
            seaborn>=0.13.0

      # ── Step 4: Setup Conda ──
      - name: "🐍 Setup Miniconda"
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          python-version: ${{ env.PYTHON_VERSION }}
          auto-update-conda: true
          auto-activate-base: true

      # ── Step 5: Verifikasi File Kritis berdasarkan Folder Anda ──
      - name: "🔍 Verifikasi MLProject & Dataset"
        run: |
          echo "=== Cek file MLProject di sub-folder ==="
          test -f ${{ env.PROJECT_DIR }}/MLProject  && echo "✅ MLProject ditemukan"  || (echo "❌ MLProject tidak ada"; exit 1)
          test -f ${{ env.PROJECT_DIR }}/conda.yaml && echo "✅ conda.yaml ditemukan" || (echo "❌ conda.yaml tidak ada"; exit 1)
          test -f ${{ env.PROJECT_DIR }}/train.py   && echo "✅ train.py ditemukan"   || (echo "❌ train.py tidak ada"; exit 1)

          echo ""
          echo "=== Cek Dataset Preprocessing ==="
          test -f Membangun_model/telco_preprocessing/X_processed.csv && \
            echo "✅ X_processed.csv ditemukan" || \
            (echo "❌ X_processed.csv tidak ada di Membangun_model/telco_preprocessing/"; exit 1)
          test -f Membangun_model/telco_preprocessing/y_processed.csv && \
            echo "✅ y_processed.csv ditemukan" || \
            (echo "❌ y_processed.csv tidak ada di Membangun_model/telco_preprocessing/"; exit 1)

      # ── Step 6: Jalankan MLflow Project (Arahkan ke folder tujuan) ──
      - name: "🚀 Jalankan MLflow Project (mlflow run)"
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_OWNER: ${{ vars.DAGSHUB_OWNER }}
          DAGSHUB_REPO:  ${{ vars.DAGSHUB_REPO }}
        run: |
          echo "▶ Menjalankan: mlflow run ${{ env.PROJECT_DIR }}"
          
          # Berjalan langsung mengarah ke sub-folder tempat MLProject berada
          mlflow run ${{ env.PROJECT_DIR }} \
            --env-manager=conda \
            -P n_estimators="${{ github.event.inputs.n_estimators || '300' }}" \
            -P max_depth="${{ github.event.inputs.max_depth || 'None' }}" \
            -P min_samples_split="${{ github.event.inputs.min_samples_split || '5' }}" \
            -P min_samples_leaf="${{ github.event.inputs.min_samples_leaf || '2' }}" \
            -P max_features="${{ github.event.inputs.max_features || 'sqrt' }}" \
            -P class_weight="${{ github.event.inputs.class_weight || 'balanced' }}" \
            -P run_name="ci-retrain-run-${{ github.run_number }}" \
            -P dagshub_owner="${{ vars.DAGSHUB_OWNER }}" \
            -P dagshub_repo="${{ vars.DAGSHUB_REPO }}" \
            --experiment-name "Telco-Churn-Retraining"

      # ── Step 7: Cek keberadaan model (MLflow memproduksi hasil run di root secara default) ──
      - name: "🔎 Verifikasi Model Output"
        run: |
          if [ -d "${{ env.MODEL_LOCAL_DIR }}" ]; then
            echo "✅ Model berhasil disimpan di: ${{ env.MODEL_LOCAL_DIR }}/"
            ls -lh ${{ env.MODEL_LOCAL_DIR }}/
          elif [ -d "${{ env.PROJECT_DIR }}/${{ env.MODEL_LOCAL_DIR }}" ]; then
            echo "✅ Model ditemukan di folder project. Menyalin ke root..."
            cp -r ${{ env.PROJECT_DIR }}/${{ env.MODEL_LOCAL_DIR }} .
            ls -lh ${{ env.MODEL_LOCAL_DIR }}/
          else
            echo "❌ Folder model tidak ditemukan"
            exit 1
          fi

      # ── Step 8: Tampilkan log artefak ──
      - name: "📋 Tampilkan Artefak Evaluasi"
        if: always()
        run: |
          if [ -d "${{ env.PROJECT_DIR }}/${{ env.ARTIFACT_DIR }}" ]; then
            cp -r ${{ env.PROJECT_DIR }}/${{ env.ARTIFACT_DIR }} . 2>/dev/null || true
          fi
          ls -lh ${{ env.ARTIFACT_DIR }}/ 2>/dev/null || echo "(folder artifacts kosong)"

      # ── Step 9: Upload artefak ke GitHub Actions ──
      - name: "💾 Upload Artefak ke GitHub Actions"
        uses: actions/upload-artifact@v4
        with:
          name: "evaluation-artifacts-run-${{ github.run_number }}"
          path: |
            ${{ env.ARTIFACT_DIR }}/
          retention-days: 30

      # ── Step 10: Set output untuk job berikutnya ──
      - name: "📤 Set Job Outputs"
        id: set-outputs
        run: |
          echo "docker_image=${{ env.DOCKER_IMAGE_NAME }}" >> $GITHUB_OUTPUT
          echo "run_id=${{ github.run_id }}"               >> $GITHUB_OUTPUT

      # ── Step 11: Commit model baru ke repositori ──
      - name: "🔁 Commit & Push Model ke Repositori"
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"

          git add ${{ env.MODEL_LOCAL_DIR }}/ \
                  ${{ env.ARTIFACT_DIR }}/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "✅ Tidak ada perubahan model. Commit dilewati."
          else
            git commit -m "🤖 [CI] Retrain model — Run #${{ github.run_number }}"
            git push
            echo "✅ Model berhasil di-push ke repositori."
          fi

  # ════════════════════════════════════════════════════════════
  # JOB 2: BUILD & PUSH DOCKER IMAGE KE DOCKER HUB
  # ════════════════════════════════════════════════════════════
  build-and-push-docker:
    name: "🐳 Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: retrain

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: "🐍 Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: "📦 Install MLflow CLI"
        run: |
          pip install --upgrade pip
          pip install mlflow==${{ env.MLFLOW_VERSION }} scikit-learn>=1.4.0

      - name: "🔧 Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔐 Login ke Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "🔍 Verifikasi saved_model/"
        run: |
          # Ambil model dari root atau dari project folder jika dicommit di sana
          if [ ! -d "${{ env.MODEL_LOCAL_DIR }}" ] && [ -d "${{ env.PROJECT_DIR }}/${{ env.MODEL_LOCAL_DIR }}" ]; then
            cp -r ${{ env.PROJECT_DIR }}/${{ env.MODEL_LOCAL_DIR }} .
          fi
          
          if [ ! -d "${{ env.MODEL_LOCAL_DIR }}" ]; then
            echo "❌ Folder ${{ env.MODEL_LOCAL_DIR }} tidak ditemukan."
            exit 1
          fi
          echo "✅ saved_model/ siap dipakai untuk Docker build."

      - name: "🏗️ Build Docker Image via MLflow"
        run: |
          FULL_IMAGE="${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}"
          FULL_IMAGE_SHA="${{ env.DOCKER_IMAGE_NAME }}:sha-${{ github.sha }}"

          mlflow models build-docker \
            --model-uri "${{ env.MODEL_LOCAL_DIR }}" \
            --name "$FULL_IMAGE" \
            --enable-mlserver

          docker tag "$FULL_IMAGE" "$FULL_IMAGE_SHA"

      - name: "🚀 Push Docker Image ke Docker Hub"
        run: |
          FULL_IMAGE="${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}"
          FULL_IMAGE_SHA="${{ env.DOCKER_IMAGE_NAME }}:sha-${{ github.sha }}"
          docker push "$FULL_IMAGE"
          docker push "$FULL_IMAGE_SHA"

  # ════════════════════════════════════════════════════════════
  # JOB 3: NOTIFIKASI RINGKASAN PIPELINE
  # ════════════════════════════════════════════════════════════
  pipeline-summary:
    name: "📋 Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [retrain, build-and-push-docker]
    if: always()

    steps:
      - name: "📊 Ringkasan Seluruh Pipeline"
        run: |
          RETRAIN_STATUS="${{ needs.retrain.result }}"
          DOCKER_STATUS="${{ needs.build-and-push-docker.result }}"

          echo "## 🔁 Retrain & Deploy Pipeline — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| ⚙️ MLflow Retraining | $RETRAIN_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker Build/Push | $DOCKER_STATUS |" >> $GITHUB_STEP_SUMMARY
